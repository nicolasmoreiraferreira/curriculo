name: Publicar currículo

on:
  push:
    branches: [main]
  workflow_dispatch:

# O site é servido a partir da branch gh-pages (GitHub Pages, modo legacy).
# Publicar por artefato (deploy-pages) não funciona nesse modo: o job é
# recusado pelas regras de proteção do ambiente, então o conteúdo nunca chega
# ao ar. Aqui o workflow empurra o conteúdo de site/ para a gh-pages, que é o
# mecanismo que o repositório realmente usa.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Antes de publicar, confere que os PDFs continuam em uma página e com texto
  # extraível — um currículo que virou imagem ou passou para duas páginas quebra
  # o formulário de candidatura sem ninguém perceber.
  #
  # Currículos precisam do limite alto de texto (>2000 caracteres) porque são
  # lidos por formulários que preenchem o perfil automaticamente. Documentos
  # curtos por natureza, como a carta de apresentação, têm limite próprio: o que
  # importa neles é serem legíveis por máquina, não serem longos.
  validar:
    name: validar os PDFs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir páginas e extração de texto
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          falhou=0
          for f in site/*.pdf; do
            paginas=$(pdfinfo "$f" | awk '/^Pages:/ {print $2}')
            texto=$(pdftotext "$f" - | wc -c)
            echo "$f -> $paginas página(s), $texto caracteres extraíveis"
            [ "$paginas" = "1" ] || { echo "ERRO: $f tem $paginas páginas"; falhou=1; }
            case "$f" in
              *Carta-Apresentacao*)
                minimo=800
                ;;
              *)
                minimo=2000
                ;;
            esac
            [ "$texto" -gt "$minimo" ] || { echo "ERRO: $f tem $texto caracteres extraíveis, mínimo esperado é $minimo"; falhou=1; }
          done
          exit $falhou
      - name: Conferir o site
        run: |
          for arq in site/index.html site/*.pdf; do
            [ -f "$arq" ] || { echo "ERRO: falta $arq"; exit 1; }
          done
          echo "site completo"

  publicar:
    name: publicar o site
    needs: validar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar em gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: "Publica o site do currículo"
